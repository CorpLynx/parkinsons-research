# Arch Linux node: arch-2080 (RTX 2080 Super) — ADMET-AI environment
# See README section 4.2.B. Pin PyTorch 2.2.2 + CUDA 12.1.
name: admet
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.2.2
  - pytorch-cuda=12.1
  - rdkit
  - pandas
  - pip
  - pip:
      - admet-ai

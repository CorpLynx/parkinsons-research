# Arch Linux node: arch-2080 (RTX 2080 Super) — REINVENT4 environment
# See README section 4.2.C. Pin PyTorch 2.2.2 + CUDA 12.1.
# After creating this env, `pip install -e .` from the REINVENT4 checkout.
name: reinvent4
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.2.2
  - pytorch-cuda=12.1
  - rdkit
  - pandas
  - pip
